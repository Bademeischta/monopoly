# PPO hyper-parameters (§7.3). gamma is overridden by artifacts/frozen/gamma.json after the sweep.
n_envs: 16            # upper bound; capped to the number of CPU cores and to a divisor of rollout_size
n_steps: 256          # ignored while rollout_size is set (n_steps = rollout_size / n_envs)
rollout_size: 512     # transitions per PPO update on every machine (A-146; 4096 learned far too slowly)
batch_size: 512
n_epochs: 10
learning_rate: 0.0003
gamma: 0.995
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
net_arch_pi: [256, 256]
net_arch_vf: [256, 256]
activation: relu
ortho_init: true
layer_norm: false     # option: LayerNorm on the input via a custom features extractor
device: cpu
total_timesteps: 10000000
checkpoint_interval: 100000
keep_checkpoints: 10
select_eval_interval: 500000
select_eval_seeds: 200
vec_env: dummy        # subproc after the benchmark recommendation
budget_hours: 12.0
eval_budget_fraction: 0.2
ev_warning_fraction: 0.2
ev_warning_threshold: 0.3
