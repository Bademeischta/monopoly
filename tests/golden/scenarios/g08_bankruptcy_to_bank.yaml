name: bankruptcy_to_bank_auctions
rules: [R-703, P-12]
description: Bankrott gegenüber der Bank; Rechte fallen unbelastet an die Bank und werden einzeln versteigert.
ruleset: OFFICIAL_US_CLASSIC_2008
players: 3
setup:
  cash: {0: 50}
  own: [{seat: 0, props: [0, 1], mortgaged: true}]
  dice: [[1, 3]]
steps:
  - until: {seat: 1, kind: AUCTION_BID}
  - do: {bid: 10}
  - do: pass
  - do: pass
  - do: {bid: 20}
expect:
  bankrupt: {0: true}
  owner: {0: 1, 1: 2}
  mortgaged: {0: false, 1: false}
  cash: {1: 1490, 2: 1480}
  events: [BANKRUPTCY, AUCTION_STARTED, AUCTION_WON]
