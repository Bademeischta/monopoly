name: pay_each_bankruptcy
rules: [P-07, R-610, R-703]
description: Zahlung an jeden Mitspieler; Bankrott während der Zahlungen gilt gegenüber der Bank.
ruleset: OFFICIAL_US_CLASSIC_2008
players: 4
setup:
  positions: {0: 3}
  cash: {0: 120}
  own: [{seat: 0, props: [3], mortgaged: true}]
  dice: [[1, 3]]
  cards: {A: [A15]}
steps:
  - until: {seat: 1, kind: MAIN, phase: OUT_OF_TURN}
expect:
  bankrupt: {0: true}
  cash: {1: 1550, 2: 1550, 3: 1500}
  owner: {3: -1}
  mortgaged: {3: false}
  events: [AUCTION_NO_SALE]
