expect:
  bankrupt: {0: true}
  owner: {0: 1, 1: 1, 2: 1}
  mortgaged: {0: true, 1: true, 2: true}
  cash: {0: 0, 1: 1584}
  events: [DEBT_STARTED, PROPERTY_MORTGAGED, BANKRUPTCY, ASSETS_TRANSFERRED, INTEREST_PAID]
