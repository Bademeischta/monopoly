name: bankruptcy_to_player
rules: [R-702, R-503, P-06]
description: Schuldenphase mit Belastung, danach Bankrott gegenüber dem Gläubiger mit Zins auf geerbte Hypotheken.
ruleset: OFFICIAL_US_CLASSIC_2008
players: 3
setup:
  positions: {0: 26}
  cash: {0: 0}
